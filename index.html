<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kiosk POS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f6f5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Kiosk POS</title>
<style>
html{color-scheme:light dark}
[hidden]{display:none!important}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

/* Layout: one-screen register. Item grid on the left, running order on the right; Stock, Daily Report and Items are separate tabs. */
:root{--bg:#eef1f0;--card:#ffffff;--ink:#1b2321;--mute:#5d6b67;--line:#d9dfdd;--accent:#1f6f5c;--accent2:#dcefe9;--on-accent:#ffffff;--ok:#1d7a46;--bad:#b42318;--badbg:#fde8e6;--field:#ffffff;--scrim:rgba(10,20,17,.5)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121715;--card:#1b2220;--ink:#e8eeec;--mute:#93a39e;--line:#2d3836;--accent:#4fb99d;--accent2:#1f3a33;--on-accent:#0b1512;--ok:#5fd08f;--bad:#ff8a7a;--badbg:#3a1f1c;--field:#151b19;--scrim:rgba(0,0,0,.65);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121715;--card:#1b2220;--ink:#e8eeec;--mute:#93a39e;--line:#2d3836;--accent:#4fb99d;--accent2:#1f3a33;--on-accent:#0b1512;--ok:#5fd08f;--bad:#ff8a7a;--badbg:#3a1f1c;--field:#151b19;--scrim:rgba(0,0,0,.65);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;-webkit-user-select:none;user-select:none}
input,select,textarea,button{font:inherit;color:var(--ink)}
input,select,textarea{-webkit-user-select:text;user-select:text;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:16px}
input[type=checkbox]{width:22px;height:22px;padding:0;accent-color:var(--accent);flex-shrink:0}
button{cursor:pointer}
.app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1;min-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:4px}
.nav button{border:0;background:transparent;padding:10px 16px;border-radius:10px;font-weight:600;color:var(--mute);font-size:16px}
.nav button.on{background:var(--accent);color:var(--on-accent)}
main{flex:1;min-height:0;overflow:hidden}
.view{display:none;height:100%}
.view.on{display:block}
#v-sale.on{display:flex}
.left{flex:1;min-width:0;display:flex;flex-direction:column}
.cats{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;flex-shrink:0}
.cats button{border:1px solid var(--line);background:var(--card);padding:12px 20px;border-radius:999px;font-weight:600;font-size:16px;white-space:nowrap}
.cats button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.grid{flex:1;overflow-y:auto;padding:4px 16px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:104px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:8px;position:relative}
.tile:active{background:var(--accent2)}
.tile b{font-size:16px;line-height:1.2;padding-right:22px;display:block}
.tile span{color:var(--accent);font-weight:700;font-size:17px}
.tile small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.tile .badge{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--on-accent);border-radius:999px;min-width:24px;height:24px;line-height:24px;text-align:center;font-size:13px;font-weight:700;padding:0 6px}
.stk{display:block;color:var(--mute);font-size:12px;margin-top:3px}
.stk.out{color:var(--bad);font-weight:700}
.empty{color:var(--mute);padding:30px 16px;grid-column:1/-1}
.cart{width:350px;flex-shrink:0;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.cart h2{margin:0;padding:12px 16px;font-size:17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.cart h2 .hb{display:flex;gap:6px}
.lines{flex:1;overflow-y:auto;padding:6px 12px;min-height:0}
.line{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--line)}
.line .n{flex:1;min-width:0}
.line .n div{font-weight:600;font-size:15px}
.line .n small{color:var(--mute)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;font-weight:700}
.qty span{min-width:22px;text-align:center;font-weight:700}
.line .t{width:62px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.foot{padding:14px 16px;border-top:1px solid var(--line)}
.total{display:flex;justify-content:space-between;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.cash{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:14px;color:var(--mute)}
.cash input{flex:1;padding:10px;width:100%}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:700;font-size:16px;background:var(--accent);color:var(--on-accent)}
.btn.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:var(--badbg);color:var(--bad)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.4}
.btn.full{width:100%}
.scroll{height:100%;overflow-y:auto;padding:16px;max-width:900px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.stat small{color:var(--mute)}
.stat div{font-size:26px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);font-size:15px;font-variant-numeric:tabular-nums}
th{color:var(--mute);font-size:13px;font-weight:600;white-space:nowrap}
td.r,th.r{text-align:right}
tfoot td{font-weight:800;border-bottom:0}
.itemrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.itemrow .n{flex:1;min-width:0}
.chip{display:inline-block;background:var(--accent2);color:var(--accent);border-radius:999px;padding:6px 12px;margin:0 6px 6px 0;font-size:14px;font-weight:600}
.chip i{font-style:normal;margin-left:8px;color:var(--bad);cursor:pointer;padding:4px}
.modal-bg{position:fixed;inset:0;background:var(--scrim);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal-bg.on{display:flex}
.modal{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:420px;max-height:92%;overflow-y:auto}
.modal.wide{max-width:580px}
.modal h3{margin:0 0 12px}
.modal .f{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.modal .f label{font-size:13px;color:var(--mute)}
.modal .f input,.modal .f select,.modal textarea{width:100%}
.modal textarea{height:180px;font-family:"Courier New",monospace;font-size:12px;resize:none}
.chk{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:15px}
.pline{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:var(--bg)}
.pline select{flex:1;min-width:0}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.pgrid .f{margin-bottom:0}
.rec{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--bg)}
.rline{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.rline select{flex:1;min-width:0}
.rline input{width:84px}
.ru{min-width:28px;color:var(--mute);font-size:14px}
.rtot{display:flex;justify-content:space-between;font-size:17px;margin-top:10px;font-variant-numeric:tabular-nums}
.receipt{font-family:"Courier New",monospace;font-size:14px}
.receipt h2{text-align:center;margin:0 0 4px;font-family:-apple-system,sans-serif}
.receipt .c{text-align:center;color:var(--mute)}
.receipt hr{border:0;border-top:1px dashed var(--mute);margin:10px 0}
.receipt .l{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.receipt .sub{color:var(--mute);font-size:12px}
.receipt .tot{font-size:18px;font-weight:800}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;display:none;z-index:20;max-width:90%;text-align:center}
.void{color:var(--bad);font-weight:700}
.note{color:var(--mute);font-size:13px;margin-top:8px}
.neg{color:var(--bad);font-weight:700}
.sync{font-size:12px;color:var(--mute);white-space:nowrap}
.sync.bad{color:var(--bad);font-weight:700}
.boot{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:30;color:var(--mute);font-size:16px}
.numpad{display:grid;grid-template-columns:minmax(84px,1.7fr) repeat(10,minmax(0,1fr));gap:6px;padding:8px 16px 10px;border-top:1px solid var(--line);background:var(--card);flex-shrink:0}
.npk,.npq{height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;font-weight:700;padding:0}
.npk:active{background:var(--accent2)}
.npq{font-size:15px;color:var(--mute);white-space:nowrap}
.npq.set{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.drows{margin-bottom:6px}
.dr{display:flex;justify-content:space-between;gap:8px;font-size:15px;color:var(--mute);padding:1px 0;font-variant-numeric:tabular-nums}
.dr .lnk{border:0;background:transparent;color:var(--bad);font-weight:700;padding:2px 6px;font-size:15px}
.act{display:flex;gap:8px}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:15px}
.seg button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
@media(max-width:560px){.numpad{grid-template-columns:repeat(6,minmax(0,1fr))}.npq{grid-column:span 2}.long{display:none}}
@media(max-width:820px){.nav{flex-wrap:wrap}.nav button{padding:9px 9px}#v-sale.on{flex-direction:column}.cart{width:100%;height:46%;border-left:0;border-top:1px solid var(--line)}.nav button{padding:10px 10px;font-size:14px}}
@media(max-width:560px){
 .cart{height:56%}
 .cart h2{padding:8px 16px}
 .foot{padding:8px 16px 10px}
 .total{font-size:22px}
 #cartLbp{margin-bottom:6px!important}
 .cash{margin-bottom:6px}
 .cash input{padding:8px}
 .act .btn{padding:12px 14px}
 .npk,.npq{height:42px}
 .numpad{padding:6px 16px 8px}
 .dr{font-size:14px}
 .drows{margin-bottom:4px}
}
@media(max-width:480px){.pgrid{grid-template-columns:1fr 1fr}.pgrid .f:last-child{grid-column:1/-1}}
</style>
</head>
<body>


<div class="app">
 <header>
  <h1 id="storeTitle">Kiosk POS</h1>
  <span id="sync" class="sync"></span>
  <div class="nav">
   <button data-v="sale" class="on">Sale</button>
   <button data-v="stock">Stock</button>
   <button data-v="purchases">Purchases</button>
   <button data-v="report"><span class="long">Daily </span>Report</button>
   <button data-v="items">Items</button>
  </div>
 </header>
 <main>
  <section class="view on" id="v-sale">
   <div class="left">
    <div class="cats" id="cats"></div>
    <div class="grid" id="grid"></div>
    <div class="numpad" id="numpad"></div>
   </div>
   <div class="cart">
    <h2>Current order <span class="hb"><button class="btn sec sm" id="clearLast">Clear last</button><button class="btn sec sm" id="clearAll">Clear all</button></span></h2>
    <div class="lines" id="lines"></div>
    <div class="foot">
     <div class="drows" id="discRows" hidden></div>
     <div class="total"><span>Total</span><span id="cartTotal">$0.00</span></div>
     <div id="cartLbp" style="text-align:right;font-weight:700;color:var(--accent);margin-bottom:10px;font-size:16px">0 LL</div>
     <div class="cash"><span>Cash received</span><input id="cash" type="number" inputmode="decimal" step="0.01" placeholder="optional"></div>
     <div class="cash" id="changeRow" hidden><span>Change due</span><b id="change" style="color:var(--ok);font-size:18px"></b></div>
     <div class="act"><button class="btn sec" id="discBtn" disabled>Discount</button><button class="btn" id="checkout" style="flex:1" disabled>Checkout &amp; Invoice</button></div>
    </div>
   </div>
  </section>
  <section class="view" id="v-stock"><div class="scroll" id="stockView"></div></section>
  <section class="view" id="v-purchases"><div class="scroll" id="purchasesView"></div></section>
  <section class="view" id="v-report"><div class="scroll" id="report"></div></section>
  <section class="view" id="v-items"><div class="scroll" id="itemsView"></div></section>
 </main>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>

var KEY='kioskpos_v1';
var S={store:'My Kiosk',rate:89500,cats:['Drinks','Cigarettes','Purchases'],items:[],sales:[],counter:0,purchases:[],pcounter:0,days:[],units:['pcs','kg','g','L','ml']};
var cart={},cartOrder=[]; var curCat=null; var reportSel='open'; var curView='sale';
var storageOK=true;

function load(){try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);for(var k in d)S[k]=d[k];}}catch(e){storageOK=false}}

/* Storage: this device only (localStorage), works with no internet. */
function setSync(st){
 var e=document.getElementById('sync');if(!e)return;
 e.textContent=(st==='error')?'Could not save on this iPad':'Works offline';
 e.className='sync'+(st==='error'?' bad':'');
}
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(S));setSync('saved')}
 catch(e){storageOK=false;setSync('error');toast('Could not save on this iPad. Make a backup now.')}
}
function bootDone(){var b=$('boot');if(b)b.hidden=true}
function initDb(){
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
 setSync('saved');bootDone();
}
function migrate(){
 if(!S.purchases)S.purchases=[]; if(!S.pcounter)S.pcounter=0;
 if(!S.days)S.days=[]; if(!S.units||!S.units.length)S.units=['pcs','kg','g','L','ml'];
 var extra=[];
 S.items.forEach(function(i){
  if(i.track===undefined)i.track=false;if(i.stock===undefined)i.stock=0;if(i.cost===undefined)i.cost=0;if(!i.unit)i.unit='pcs';if(!i.recipe)i.recipe=[];if(i.noSale===undefined)i.noSale=false;
  if(!i.kind){
   if(i.recipe.length)i.kind='sale';
   else if(i.noSale)i.kind='stock';
   else if(i.track){
    /* an older item that held its own stock: it becomes a stock item, and a sale item with the same name uses it */
    i.kind='stock';
    extra.push({id:uid(),kind:'sale',name:i.name,price:i.price,cat:i.cat,noSale:false,recipe:[{itemId:i.id,qty:1}],track:false,unit:'pcs',stock:0,cost:0});
    i.price=0;i.cat='';
   }
   else i.kind='sale';
  }
  if(i.kind==='stock'){i.track=true;if(i.supplier===undefined)i.supplier='';if(!i.buyUnit)i.buyUnit=i.unit;if(!(i.factor>0))i.factor=1}
 });
 extra.forEach(function(x){S.items.push(x)});
 S.items.forEach(function(i){if(i.kind==='stock'){[i.unit,i.buyUnit].forEach(function(u){if(u&&S.units.indexOf(u)<0)S.units.push(u)})}});
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return '$'+(Math.round(n*100)/100).toFixed(2)}
function lbp(n,r){return Math.round(n*(r||S.rate||0)).toLocaleString('en-US')+' LL'}
function fmtN(n){return String(Math.round(n*1000)/1000)}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n}
function r2(n){return String(Math.round(n*100)/100)}
function r4(n){return String(Math.round(n*10000)/10000)}
function pad(n,w){n=String(n);while(n.length<w)n='0'+n;return n}
function dkey(ts){var d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2)}
function today(){return dkey(Date.now())}
function fmtTime(ts){var d=new Date(ts);return pad(d.getHours(),2)+':'+pad(d.getMinutes(),2)}
function fmtDT(ts){return dkey(ts)+' '+fmtTime(ts)}
function dateToTs(ds){var p=String(ds).split('-');if(p.length!==3)return Date.now();var n=new Date();return new Date(+p[0],+p[1]-1,+p[2],n.getHours(),n.getMinutes()).getTime()}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display='none'},2600)}
function $(id){return document.getElementById(id)}
function findItem(id){for(var i=0;i<S.items.length;i++)if(S.items[i].id===id)return S.items[i];return null}
function isBuyable(i){return i.kind==='stock'}
function fct(i){return i.factor>0?i.factor:1}
function buyU(i){return i.buyUnit||i.unit}
function stockText(i){var f=fct(i);if(buyU(i)===i.unit&&f===1)return fmtN(i.stock)+' '+i.unit;return fmtN(i.stock/f)+' '+buyU(i)+' ('+fmtN(i.stock)+' '+i.unit+')'}
function suggestFactor(b,u){if(b===u)return 1;var t={'l>ml':1000,'kg>g':1000,'l>cl':100,'cl>ml':10,'m>cm':100};return t[(b+'>'+u).toLowerCase()]||null}
function unitOptHtml(sel){var l=S.units.slice();if(sel&&l.indexOf(sel)<0)l.push(sel);return l.map(function(u){return '<option value="'+esc(u)+'"'+(u===sel?' selected':'')+'>'+esc(u)+'</option>'}).join('')}
function itemCost(i){
 if(i.recipe&&i.recipe.length){var t=0;i.recipe.forEach(function(r){var g=findItem(r.itemId);if(g)t+=r.qty*(g.cost||0)});return t}
 return i.cost||0;
}
function canMake(i){
 if(!i.recipe||!i.recipe.length)return null;
 var n=Infinity;
 for(var k=0;k<i.recipe.length;k++){var r=i.recipe[k],g=findItem(r.itemId);if(!g||!g.track||!(r.qty>0))return null;n=Math.min(n,Math.floor(Math.max(g.stock,0)/r.qty+1e-9))}
 return n===Infinity?null:n;
}
function itemSub(i){
 var parts=[];
 if(i.recipe&&i.recipe.length){
  var c=itemCost(i);parts.push('Recipe cost '+money(c));
  if(c>0&&i.price>0)parts.push('margin '+Math.round((i.price-c)/i.price*100)+'%');
 }
 return parts.length?'<div style="color:var(--mute);font-size:12px">'+parts.join(' · ')+'</div>':'';
}

/* navigation */
document.querySelectorAll('.nav button').forEach(function(b){b.onclick=function(){showView(b.dataset.v)}});
function showView(v){
 curView=v;
 document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)});
 document.querySelectorAll('.view').forEach(function(s){s.classList.toggle('on',s.id==='v-'+v)});
 refresh();
}
function refresh(){
 if(curView==='report')renderReport(); else if(curView==='items')renderItems(); else if(curView==='stock')renderStock(); else if(curView==='purchases')renderPurchases(); else renderSale();
}

/* modal helpers */
function openModal(html,wide){$('modal').className='modal'+(wide?' wide':'');$('modal').innerHTML=html;$('modalBg').classList.add('on')}
function closeModal(){$('modalBg').classList.remove('on')}
$('modalBg').onclick=function(e){if(e.target===$('modalBg'))closeModal()};
function ask(msg,okLabel,onYes,onNo){
 openModal('<h3>Please confirm</h3><p style="margin:0 0 16px">'+esc(msg)+'</p><div class="row"><button class="btn bad" id="aYes" style="flex:1">'+esc(okLabel)+'</button><button class="btn sec" id="aNo" style="flex:1">Cancel</button></div>');
 $('aYes').onclick=function(){onYes()};
 $('aNo').onclick=function(){if(onNo)onNo();else closeModal()};
}
function showText(title,text,hint,fname){
 openModal('<h3>'+esc(title)+'</h3><textarea id="tx" readonly></textarea><div class="note">'+esc(hint)+'</div><div class="row" style="margin-top:14px"><button class="btn" id="tCopy" style="flex:1">Copy</button>'+(fname?'<button class="btn sec" id="tSave" style="flex:1">Save file</button>':'')+'<button class="btn sec" id="tClose" style="flex:1">Close</button></div>');
 if(fname)$('tSave').onclick=function(){try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download=fname;document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},800)}catch(e){toast('Could not save a file. Use Copy instead.')}};
 $('tx').value=text;
 $('tClose').onclick=closeModal;
 $('tCopy').onclick=function(){
  function fallback(){$('tx').focus();$('tx').select();toast('Selected. Press and hold, then Copy.')}
  try{navigator.clipboard.writeText(text).then(function(){toast('Copied')},fallback)}catch(e){fallback()}
 };
}

/* SALE */
var qtyBuf='',disc=null;
function qtyN(){return qtyBuf?parseInt(qtyBuf,10):1}
function updateNumpad(){var q=$('npq');if(!q)return;q.textContent=qtyBuf?'×'+qtyBuf+'  ✕':'×1';q.classList.toggle('set',!!qtyBuf)}
function pressDigit(d){var b=(qtyBuf+d).replace(/^0+/,'');if(b.length>3)return;qtyBuf=b;updateNumpad()}
function buildNumpad(){
 var h='<button class="npq" id="npq" aria-label="Quantity for the next item. Tap to reset"></button>';
 '1234567890'.split('').forEach(function(d){h+='<button class="npk" data-d="'+d+'">'+d+'</button>'});
 $('numpad').innerHTML=h;
 $('numpad').querySelectorAll('.npk').forEach(function(b){b.onclick=function(){pressDigit(b.dataset.d)}});
 $('npq').onclick=function(){qtyBuf='';updateNumpad()};
 updateNumpad();
}
function addUnits(id,n){cart[id]=(cart[id]||0)+n;for(var k=0;k<n;k++)cartOrder.push(id)}
function addUnit(id){addUnits(id,1)}
function removeUnit(id){if(!cart[id])return;cart[id]--;if(cart[id]<=0)delete cart[id];var k=cartOrder.lastIndexOf(id);if(k>=0)cartOrder.splice(k,1)}
function stockLine(i){
 var cm=canMake(i);
 if(cm!==null)return cm<=0?'<span class="stk out">Out of stock</span>':'<span class="stk">'+cm+' can be made</span>';
 if(!i.track)return '';
 return i.stock<=0?'<span class="stk out">Out of stock</span>':'<span class="stk">'+fmtN(i.stock)+' '+esc(i.unit)+' left</span>';
}
function renderSale(){
 $('storeTitle').textContent=S.store||'Kiosk POS';
 if(!curCat||S.cats.indexOf(curCat)<0)curCat=S.cats[0]||null;
 $('cats').innerHTML=S.cats.map(function(c){return '<button class="'+(c===curCat?'on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'}).join('');
 $('cats').querySelectorAll('button').forEach(function(b){b.onclick=function(){curCat=b.dataset.c;renderSale()}});
 var list=S.items.filter(function(i){return i.cat===curCat&&i.kind==='sale'});
 $('grid').innerHTML=list.length?list.map(function(i){
  var q=cart[i.id]||0;
  return '<button class="tile" data-id="'+i.id+'">'+(q?'<div class="badge">'+q+'</div>':'')+'<div><b>'+esc(i.name)+'</b>'+stockLine(i)+'</div><div><span>'+money(i.price)+'</span><small>'+lbp(i.price)+'</small></div></button>'}).join('')
  :'<div class="empty">No items in this category yet. Open the <b>Items</b> tab to add some.</div>';
 $('grid').querySelectorAll('.tile').forEach(function(t){t.onclick=function(){
  var id=t.dataset.id,it=findItem(id);
  var n=qtyN(),cm=it?canMake(it):null;
  if(cm!==null&&(cart[id]||0)+n>cm)toast('Only '+cm+' '+it.name+' can be made from the current stock');
  else if(it&&it.track&&(cart[id]||0)+n>it.stock)toast('Only '+fmtN(Math.max(it.stock,0))+' '+it.unit+' of '+it.name+' in stock');
  addUnits(id,n);qtyBuf='';updateNumpad();renderSale();
 }});
 renderCart();
}
function cartSub(){var t=0;for(var id in cart){var it=findItem(id);if(it)t+=it.price*cart[id]}return Math.round(t*100)/100}
function amountFor(t,v,sub){var a=(t==='pct')?sub*v/100:(t==='usd'?v:v/(S.rate||1));a=Math.round(a*100)/100;return Math.max(0,Math.min(a,sub))}
function discAmt(){return disc?amountFor(disc.type,disc.value,cartSub()):0}
function cartTotal(){return Math.round((cartSub()-discAmt())*100)/100}
function discLabel(d){return d.type==='pct'?fmtN(d.value)+'%':(d.type==='usd'?money(d.value):Number(d.value).toLocaleString('en-US')+' LL')}
function discountDialog(){
 var sub=cartSub();if(sub<=0)return;
 var d={type:disc?disc.type:'pct',value:disc?String(disc.value):''};
 openModal('<h3>Discount</h3><div class="note" style="margin:0 0 12px">Order subtotal '+money(sub)+'</div>'+
 '<div class="seg"><button data-t="pct">Percent %</button><button data-t="usd">Amount $</button><button data-t="lbp">Amount LL</button></div>'+
 '<div class="quick" id="dQuick">'+[5,10,15,20,50].map(function(v){return '<button class="btn sec sm" data-q="'+v+'">'+v+'%</button>'}).join('')+'</div>'+
 '<div class="f"><label for="dVal" id="dLab">Discount</label><input id="dVal" type="number" inputmode="decimal" step="any" min="0" value="'+esc(d.value)+'"></div>'+
 '<div class="note" id="dPrev" style="margin:0 0 14px"></div>'+
 '<div class="row"><button class="btn" id="dApply" style="flex:1">Apply</button>'+(disc?'<button class="btn bad" id="dRem">Remove</button>':'')+'<button class="btn sec" id="dCancel">Cancel</button></div>');
 function upd(){
  $('modal').querySelectorAll('.seg button').forEach(function(b){b.classList.toggle('on',b.dataset.t===d.type)});
  $('dQuick').hidden=(d.type!=='pct');
  $('dLab').textContent={pct:'Discount percent (%)',usd:'Discount amount ($)',lbp:'Discount amount (LL)'}[d.type];
  var v=num(d.value),a=amountFor(d.type,v,sub);
  var raw=(d.type==='pct')?sub*v/100:(d.type==='usd'?v:v/(S.rate||1));
  $('dPrev').textContent=v>0?('Discount −'+money(a)+(a<raw-0.005?' (limited to the subtotal)':'')+' → new total '+money(sub-a)+' · '+lbp(sub-a)):'Enter a discount value.';
 }
 $('modal').querySelectorAll('.seg button').forEach(function(b){b.onclick=function(){d.type=b.dataset.t;upd()}});
 $('modal').querySelectorAll('[data-q]').forEach(function(b){b.onclick=function(){d.type='pct';d.value=b.dataset.q;$('dVal').value=d.value;upd()}});
 $('dVal').oninput=function(){d.value=this.value;upd()};
 $('dCancel').onclick=closeModal;
 if($('dRem'))$('dRem').onclick=function(){disc=null;closeModal();renderCart()};
 $('dApply').onclick=function(){
  var v=num(d.value);
  if(!(v>0)){toast('Enter a discount value');return}
  if(d.type==='pct'&&v>100){toast('Percent cannot be more than 100');return}
  disc={type:d.type,value:v};closeModal();renderCart();
 };
 upd();
}
function renderCart(){
 var ids=Object.keys(cart).filter(function(id){return findItem(id)});
 if(!ids.length)disc=null;
 $('lines').innerHTML=ids.length?ids.map(function(id){var it=findItem(id),q=cart[id];
  return '<div class="line"><div class="n"><div>'+esc(it.name)+'</div><small>'+money(it.price)+' each</small></div>'+
  '<div class="qty"><button data-m="'+id+'">−</button><span>'+q+'</span><button data-p="'+id+'">+</button></div>'+
  '<div class="t">'+money(it.price*q)+'</div></div>'}).join(''):'<div class="empty" style="padding:20px 8px">Tap items to add them.</div>';
 $('lines').querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){removeUnit(b.dataset.m);renderSale()}});
 $('lines').querySelectorAll('[data-p]').forEach(function(b){b.onclick=function(){addUnit(b.dataset.p);renderSale()}});
 var sub=cartSub(),da=discAmt(),t=cartTotal();
 if(disc&&ids.length&&da>0){$('discRows').hidden=false;$('discRows').innerHTML='<div class="dr"><span>Subtotal</span><span>'+money(sub)+'</span></div><div class="dr"><span>Discount ('+esc(discLabel(disc))+') <button class="lnk" id="discX" aria-label="Remove discount">✕</button></span><span>−'+money(da)+'</span></div>';$('discX').onclick=function(){disc=null;renderCart()}}else $('discRows').hidden=true;
 $('cartTotal').textContent=money(t);$('cartLbp').textContent=lbp(t);$('checkout').disabled=!ids.length;$('discBtn').disabled=!ids.length;updateChange();
}
function updateChange(){
 var c=parseFloat($('cash').value),t=cartTotal();
 if(!isNaN(c)&&c>0&&t>0){$('changeRow').hidden=false;$('change').textContent=c>=t?money(c-t)+' ('+lbp(c-t)+')':'Short '+money(t-c)}else $('changeRow').hidden=true;
}
$('cash').oninput=updateChange;
$('clearLast').onclick=function(){var id=cartOrder[cartOrder.length-1];if(id)removeUnit(id);renderSale()};
$('clearAll').onclick=function(){cart={};cartOrder=[];disc=null;qtyBuf='';updateNumpad();$('cash').value='';renderSale()};
$('discBtn').onclick=discountDialog;
$('checkout').onclick=function(){
 var lines=[];for(var id in cart){var it=findItem(id);if(it){
  var ln={itemId:id,name:it.name,price:it.price,cost:Math.round(itemCost(it)*10000)/10000,qty:cart[id],cat:it.cat};
  if(it.recipe&&it.recipe.length){var cq=cart[id];ln.used=it.recipe.map(function(r){return {id:r.itemId,qty:Math.round(r.qty*cq*1000)/1000}})}
  lines.push(ln);
 }}
 if(!lines.length)return;
 var total=0;lines.forEach(function(l){total+=l.price*l.qty});
 var cash=parseFloat($('cash').value);
 var da=Math.min(discAmt(),total);
 S.counter++;
 var sale={id:uid(),no:S.counter,ts:Date.now(),items:lines,sub:Math.round(total*100)/100,total:Math.round((total-da)*100)/100,discount:(disc&&da>0)?{type:disc.type,value:disc.value,amount:da}:null,rate:S.rate,cash:(!isNaN(cash)&&cash>0)?cash:null,void:false};
 var warn=[];
 lines.forEach(function(l){
  if(l.used){l.used.forEach(function(u){var g=findItem(u.id);if(g&&g.track){g.stock=Math.round((g.stock-u.qty)*1000)/1000;if(g.stock<=0&&warn.indexOf(g.name)<0)warn.push(g.name)}})}
  else{var it2=findItem(l.itemId);if(it2&&it2.track){it2.stock=Math.round((it2.stock-l.qty)*1000)/1000;if(it2.stock<=0)warn.push(it2.name)}}
 });
 S.sales.push(sale);save();
 cart={};cartOrder=[];disc=null;qtyBuf='';updateNumpad();$('cash').value='';renderSale();
 showInvoice(sale,true);
 if(warn.length)toast('Out of stock: '+warn.join(', '));
};

/* INVOICE */
function receiptHTML(s){
 var h='<div class="receipt"><h2>'+esc(S.store||'Kiosk')+'</h2><div class="c">Invoice #'+pad(s.no,4)+'<br>'+fmtDT(s.ts)+'</div><hr>';
 s.items.forEach(function(l){h+='<div class="l"><span>'+l.qty+' × '+esc(l.name)+'</span><span>'+money(l.price*l.qty)+'</span></div>'+(l.qty>1?'<div class="l sub"><span>&nbsp;&nbsp;@ '+money(l.price)+'</span><span></span></div>':'')});
 h+='<hr>'+(s.discount&&s.discount.amount>0?'<div class="l"><span>Subtotal</span><span>'+money(s.sub!==undefined?s.sub:s.total+s.discount.amount)+'</span></div><div class="l"><span>Discount ('+esc(discLabel(s.discount))+')</span><span>−'+money(s.discount.amount)+'</span></div>':'')+'<div class="l tot"><span>TOTAL</span><span>'+money(s.total)+'</span></div><div class="l tot"><span>TOTAL (LBP)</span><span>'+lbp(s.total,s.rate)+'</span></div><div class="l sub"><span>Rate: 1 USD = '+Number(s.rate||S.rate).toLocaleString('en-US')+' LL</span><span></span></div>';
 if(s.cash)h+='<div class="l"><span>Cash</span><span>'+money(s.cash)+'</span></div><div class="l"><span>Change</span><span>'+money(Math.max(0,s.cash-s.total))+'</span></div>';
 if(s.void)h+='<hr><div class="c void">*** VOIDED ***</div>';
 h+='<hr><div class="c">Thank you!</div></div>';return h;
}
function showInvoice(s,isNew){
 openModal(receiptHTML(s)+'<div class="row" style="margin-top:16px"><button class="btn" id="mClose" style="flex:1">'+(isNew?'New sale':'Close')+'</button></div>');
 $('mClose').onclick=closeModal;
}

/* STOCK + PURCHASES */
function renderStock(){
 var stock=S.items.filter(function(i){return i.kind==='stock'}).sort(function(a,b){return a.name.localeCompare(b.name)});
 var val=0,out=0;stock.forEach(function(i){val+=Math.max(i.stock,0)*(i.cost||0);if(i.stock<=0)out++});
 var h='<div class="stats"><div class="stat"><small>Stock items</small><div>'+stock.length+'</div></div><div class="stat"><small>Stock value at cost</small><div>'+money(val)+'</div></div><div class="stat"><small>Out of stock</small><div'+(out?' class="neg" style="font-size:26px"':'')+'>'+out+'</div></div></div>';
 h+='<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 style="margin:0">Stock items</h3><button class="btn" id="newStock">+ Add stock item</button></div>';
 if(!stock.length){h+='<div style="color:var(--mute)">No stock items yet. Add what you buy from your suppliers, for example coffee beans or water. Then record what you buy in the Purchases tab. Stock items are only used on purchase invoices and in recipes, so they never appear on the Sale screen.</div>'}
 else{
  h+='<div class="tbl"><table><thead><tr><th>Item</th><th>Supplier</th><th class="r">In stock</th><th class="r">Cost each</th><th></th></tr></thead><tbody>';
  stock.forEach(function(i){
   h+='<tr><td>'+esc(i.name)+'</td><td>'+(i.supplier?esc(i.supplier):'<span style="color:var(--mute)">-</span>')+'</td><td class="r"><span'+(i.stock<=0?' class="neg"':'')+'>'+esc(stockText(i))+'</span></td><td class="r">'+(i.cost>0?money(i.cost*fct(i))+'/'+esc(buyU(i)):'-')+'</td><td class="r"><button class="btn sec sm" data-e="'+i.id+'">Edit</button></td></tr>';
  });
  h+='</tbody></table></div><div class="note">Quantities and costs update when you save a purchase invoice in the Purchases tab. Each sale takes the recipe amounts out of stock. Cost each is the average of your purchases. Set up what you sell, and its recipe, in the Items tab.</div>';
 }
 h+='</div>';
 $('stockView').innerHTML=h;
 $('newStock').onclick=function(){editStock(null)};
 $('stockView').querySelectorAll('[data-e]').forEach(function(b){b.onclick=function(){editStock(b.dataset.e)}});
}
function editStock(id){
 var it=id?findItem(id):null;
 var buy=it?buyU(it):'kg',unit=it?it.unit:'kg',fac=it?fct(it):1;
 openModal('<h3>'+(it?'Edit stock item':'New stock item')+'</h3>'+
 '<div class="f"><label for="sName">Name</label><input id="sName" value="'+esc(it?it.name:'')+'" placeholder="e.g. Water"></div>'+
 '<div class="f"><label for="sSup">Supplier (optional)</label><input id="sSup" value="'+esc(it?(it.supplier||''):'')+'" placeholder="e.g. Al Amal Trading"></div>'+
 '<div class="row" style="margin-bottom:12px"><div class="f" style="flex:1;min-width:130px;margin:0"><label for="sBuy">Buying unit</label><select id="sBuy">'+unitOptHtml(buy)+'</select></div>'+
 '<div class="f" style="flex:1;min-width:130px;margin:0"><label for="sUnit">Recipe unit</label><select id="sUnit">'+unitOptHtml(unit)+'</select></div></div>'+
 '<div class="f" id="sConv"><label for="sFac"><span id="sConvL"></span></label><input id="sFac" type="number" inputmode="decimal" step="any" min="0" value="'+fac+'"></div>'+
 '<div class="note" style="margin:0 0 14px">You buy this item in the buying unit and use it in recipes in the recipe unit, for example buy in L and use in ml. The quantity in stock and the cost come from your purchase invoices in the Purchases tab.</div>'+
 '<div class="row"><button class="btn" id="sSave" style="flex:1">Save</button>'+(it?'<button class="btn bad" id="sDel">Delete</button>':'')+'<button class="btn sec" id="sCancel">Cancel</button></div>',true);
 function labels(){
  var b=$('sBuy').value,u=$('sUnit').value;
  $('sConv').hidden=(b===u);
  $('sConvL').textContent='1 '+b+' = how many '+u+'?';
 }
 function unitsChanged(){
  var b=$('sBuy').value,u=$('sUnit').value;
  if(b===u)$('sFac').value=1;
  else{var sg=suggestFactor(b,u);if(sg)$('sFac').value=sg;else if(num($('sFac').value)===1)$('sFac').value=''}
  labels();
 }
 labels();
 $('sBuy').onchange=unitsChanged;$('sUnit').onchange=unitsChanged;
 $('sCancel').onclick=closeModal;
 $('sSave').onclick=function(){
  var n=$('sName').value.trim(),b=$('sBuy').value,u=$('sUnit').value,f=(b===u)?1:num($('sFac').value);
  if(!n){toast('Enter a name');return}
  if(!(f>0)){toast('Enter how many '+u+' are in 1 '+b);return}
  var unitChanged=!!(it&&it.unit!==u);
  if(unitChanged){
   var usedBy=S.items.filter(function(x){return (x.recipe||[]).some(function(r){return r.itemId===it.id})})[0];
   if(usedBy){toast(it.name+' is used in the recipe of '+usedBy.name+'. Remove it there before changing its recipe unit.');return}
  }
  var f2={name:n,supplier:$('sSup').value.trim(),buyUnit:b,unit:u,factor:f,kind:'stock',track:true,price:0,cat:'',recipe:[],noSale:false};
  if(it){
   if(unitChanged){var oldF=fct(it);f2.stock=Math.round(it.stock/oldF*f*1000)/1000;f2.cost=Math.round(it.cost*oldF/f*1e8)/1e8}
   for(var k in f2)it[k]=f2[k];
  }else{f2.stock=0;f2.cost=0;f2.id=uid();S.items.push(f2)}
  save();closeModal();refresh();
 };
 if(it)$('sDel').onclick=function(){
  var user=S.items.filter(function(x){return (x.recipe||[]).some(function(r){return r.itemId===it.id})})[0];
  if(user){toast(it.name+' is used in the recipe of '+user.name+'. Remove it there first.');return}
  ask('Delete "'+it.name+'"? Past invoices are not affected.','Delete',function(){S.items=S.items.filter(function(x){return x.id!==it.id});save();closeModal();refresh()},function(){editStock(id)});
 };
}
var pDraft=null;
function newLine(){var it=S.items.filter(isBuyable)[0];return {itemId:it?it.id:'',u:it?buyU(it):'pcs',qty:'',unit:'',total:''}}
function unitOpts(l){
 var it=findItem(l.itemId),o=[];
 if(it){o.push(buyU(it));if(it.unit!==buyU(it))o.push(it.unit)}
 if(l.u&&o.indexOf(l.u)<0)o.push(l.u);
 return o.map(function(u){return '<option value="'+esc(u)+'"'+(u===l.u?' selected':'')+'>'+esc(u)+'</option>'}).join('');
}
function baseQtyOf(it,u,q){return u===it.unit?q:q*fct(it)}
function convTxt(l){
 var it=findItem(l.itemId),q=num(l.qty);
 if(!it||q<=0)return '';
 var bq=baseQtyOf(it,l.u,q);
 return bq!==q?'= '+fmtN(bq)+' '+it.unit+' added to stock':'';
}
var pFilter={q:'',from:'',to:''};
function pLinesText(p){return p.lines.map(function(l){return fmtN(l.qty)+' '+l.unit+' '+l.name}).join(', ')}
function filteredPurchases(){
 var q=pFilter.q.trim().toLowerCase();
 return S.purchases.slice().sort(function(a,b){return b.ts-a.ts}).filter(function(p){
  var d=dkey(p.ts);
  if(pFilter.from&&d<pFilter.from)return false;
  if(pFilter.to&&d>pFilter.to)return false;
  if(q&&((p.supplier||'')+' '+p.lines.map(function(l){return l.name}).join(' ')+' P'+pad(p.no,4)).toLowerCase().indexOf(q)<0)return false;
  return true;
 });
}
function renderPurchases(){
 var h='<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h3 style="margin:0">Purchase invoices</h3><button class="btn" id="newPurchase">+ New purchase invoice</button></div>'+
 '<div class="row"><input id="fQ" type="search" placeholder="Search supplier or item" value="'+esc(pFilter.q)+'" style="flex:1;min-width:180px"><label class="note" style="margin:0" for="fFrom">From</label><input type="date" id="fFrom" value="'+esc(pFilter.from)+'"><label class="note" style="margin:0" for="fTo">To</label><input type="date" id="fTo" value="'+esc(pFilter.to)+'"><button class="btn sec sm" id="fClear">Clear</button></div></div>'+
 '<div id="pStats"></div><div class="card" id="pList"></div>'+
 '<div class="card"><div class="note" style="margin:0 0 10px">Every purchase invoice is saved on this iPad until you delete it, and it is included when you make a backup.</div><button class="btn sec sm" id="pCsv">Purchases as CSV</button></div>';
 $('purchasesView').innerHTML=h;
 $('newPurchase').onclick=purchaseDialog;
 $('fQ').oninput=function(){pFilter.q=this.value;drawPList()};
 $('fFrom').onchange=function(){pFilter.from=this.value;drawPList()};
 $('fTo').onchange=function(){pFilter.to=this.value;drawPList()};
 $('fClear').onclick=function(){pFilter={q:'',from:'',to:''};renderPurchases()};
 $('pCsv').onclick=function(){
  var rows=[['Invoice','Date','Time','Supplier','Item','Qty','Unit','Cost per unit USD','Line total USD','Rate LBP']];
  S.purchases.slice().sort(function(a,b){return a.ts-b.ts}).forEach(function(p){p.lines.forEach(function(l){rows.push(['P'+pad(p.no,4),dkey(p.ts),fmtTime(p.ts),p.supplier||'',l.name,l.qty,l.unit,(l.unitCost||0).toFixed(4),(l.total||0).toFixed(2),p.rate||S.rate])})});

function wirePurchase(){
 var d=pDraft;
 $('pSup').oninput=function(){d.supplier=this.value};

 $('pCancel').onclick=closeModal;

 $('modal').querySelectorAll('[data-pdel]').forEach(function(b){b.onclick=function(){d.lines.splice(+b.dataset.pdel,1);renderPurchase()}});
 d.lines.forEach(function(l,i){
  var sel=$('pItem'+i),q=$('pq'+i),c=$('pc'+i),t=$('pt'+i);
  function unitLbl(){$('pu'+i).textContent='('+l.u+')';$('pcl'+i).textContent='Cost per '+l.u+' ($)';$('pcv'+i).textContent=convTxt(l)}
  unitLbl();
  sel.onchange=function(){var it2=findItem(this.value);l.itemId=this.value;l.u=it2?buyU(it2):'pcs';renderPurchase()};
  $('pun'+i).onchange=function(){l.u=this.value;if(l.total!==''&&num(l.qty)>0){l.unit=r4(num(l.total)/num(l.qty));c.value=l.unit}unitLbl()};
  q.oninput=function(){l.qty=this.value;$('pcv'+i).textContent=convTxt(l);var qq=num(l.qty);if(l.unit!==''){l.total=r2(qq*num(l.unit));t.value=l.total}else if(l.total!==''&&qq>0){l.unit=r4(num(l.total)/qq);c.value=l.unit}ptotal()};
  c.oninput=function(){l.unit=this.value;if(l.unit!==''&&num(l.qty)>0){l.total=r2(num(l.qty)*num(l.unit));t.value=l.total}ptotal()};
  t.oninput=function(){l.total=this.value;if(l.total!==''&&num(l.qty)>0){l.unit=r4(num(l.total)/num(l.qty));c.value=l.unit}ptotal()};
 });

 $('pSave').onclick=savePurchase;
}
function savePurchase(){
 var d=pDraft,lines=[];
 for(var i=0;i<d.lines.length;i++){
  var l=d.lines[i],q=num(l.qty);
  if(q<=0)continue;
  var it=findItem(l.itemId);if(!it){toast('Pick an item for every line');return}
  var u=l.u||buyU(it);
  var total=l.total!==''?num(l.total):(l.unit!==''?q*num(l.unit):0);
  lines.push({itemId:it.id,name:it.name,unit:u,qty:q,baseQty:baseQtyOf(it,u,q),unitCost:total/q,total:Math.round(total*100)/100});
 }
 if(!lines.length){toast('Enter a quantity for at least one item');return}
 var sum=0;
 lines.forEach(function(l){
  var it=findItem(l.itemId);
  var ucb=l.baseQty>0?l.total/l.baseQty:0;
  if(ucb>0){
   var base=it.track?Math.max(it.stock,0):0;
   it.cost=(base>0&&it.cost>0)?(base*it.cost+l.baseQty*ucb)/(base+l.baseQty):ucb;
   it.cost=Math.round(it.cost*1e8)/1e8;
  }
  it.stock=Math.round(((it.track?it.stock:0)+l.baseQty)*1000)/1000;
  it.track=true;
  sum+=l.total;
 });
 S.pcounter++;
 S.purchases.push({id:uid(),no:S.pcounter,ts:dateToTs(d.date),supplier:d.supplier.trim(),lines:lines,total:Math.round(sum*100)/100,rate:S.rate});
 save();closeModal();refresh();toast('Purchase saved. Stock updated.');
}

 p.lines.forEach(function(l){h+='<div class="l"><span>'+fmtN(l.qty)+' '+esc(l.unit)+' × '+esc(l.name)+'</span><span>'+money(l.total)+'</span></div><div class="l sub"><span>&nbsp;&nbsp;@ '+money(l.unitCost)+' per '+esc(l.unit)+(l.baseQty!==undefined&&l.baseQty!==l.qty?' · '+fmtN(l.baseQty)+' '+(findItem(l.itemId)?esc(findItem(l.itemId).unit):'')+' added to stock':'')+'</span><span></span></div>'});
 h+='<hr><div class="l tot"><span>TOTAL</span><span>'+money(p.total)+'</span></div><div class="l tot"><span>TOTAL (LBP)</span><span>'+lbp(p.total,p.rate)+'</span></div></div>';

 $('pvClose').onclick=closeModal;

  p.lines.forEach(function(l){var it=findItem(l.itemId);var bq=(l.baseQty!==undefined?l.baseQty:l.qty);if(it&&it.track)it.stock=Math.round((it.stock-bq)*1000)/1000});
  S.purchases=S.purchases.filter(function(x){return x.id!==p.id});

 },function(){viewPurchase(id)})};
}

function dayInfo(){
 var open=reportSel==='open',d=null;
 if(!open){d=S.days.filter(function(x){return x.id===reportSel})[0];if(!d){reportSel='open';open=true}}
 return {open:open,d:d,start:open?(S.days.length?S.days[S.days.length-1].end:0):d.start,end:open?Infinity:d.end};
}
function inRange(ts,r){return ts>r.start&&ts<=r.end}
function renderReport(){
 var r=dayInfo();
 var sales=S.sales.filter(function(s){return inRange(s.ts,r)});
 var valid=sales.filter(function(s){return !s.void});
 var byCat={},byItem={},grand=0,grandL=0,units=0,profit=0,spent=0,discTot=0;
 S.purchases.forEach(function(p){if(inRange(p.ts,r))spent+=p.total});
 valid.forEach(function(s){var rt=s.rate||S.rate;var fac=(s.discount&&s.sub>0)?s.total/s.sub:1;if(s.discount)discTot+=(s.sub-s.total);s.items.forEach(function(l){
  var la=l.price*l.qty*fac;
  var a=byCat[l.cat]||(byCat[l.cat]={qty:0,amt:0,lbp:0});a.qty+=l.qty;a.amt+=la;a.lbp+=la*rt;
  var k=l.cat+'|'+l.name;var b=byItem[k]||(byItem[k]={cat:l.cat,name:l.name,qty:0,amt:0});b.qty+=l.qty;b.amt+=la;
  if(l.cost>0)profit+=la-l.cost*l.qty;
  units+=l.qty});grand+=s.total;grandL+=s.total*rt});
 var cats=S.cats.slice();Object.keys(byCat).forEach(function(c){if(cats.indexOf(c)<0)cats.push(c)});

 var h='<div class="card"><div class="row"><select id="rSel" aria-label="Choose a day" style="flex:1;min-width:200px">'+opts+'</select>'+(r.open?'<button class="btn" id="rEnd">End of day</button>':'')+((!r.open&&last&&r.d.id===last.id)?'<button class="btn bad sm" id="rUndo">Undo end of day</button>':'')+'</div><div class="note">'+esc(span)+'</div></div>';
 h+='<div class="stats"><div class="stat"><small>Total sales (USD)</small><div>'+money(grand)+'</div></div><div class="stat"><small>Total sales (LBP)</small><div style="font-size:20px;padding-top:5px">'+Math.round(grandL).toLocaleString('en-US')+' LL</div></div><div class="stat"><small>Invoices</small><div>'+valid.length+'</div></div><div class="stat"><small>Items sold</small><div>'+units+'</div></div><div class="stat"><small>Average invoice</small><div>'+money(valid.length?grand/valid.length:0)+'</div></div><div class="stat"><small>Profit on items with a cost</small><div>'+money(profit)+'</div></div><div class="stat"><small>Discounts given</small><div>'+money(discTot)+'</div></div><div class="stat"><small>Stock bought this day</small><div>'+money(spent)+'</div></div></div>';
 h+='<div class="card"><h3>Sales by category, '+esc(title)+'</h3><div class="tbl"><table><thead><tr><th>Category</th><th class="r">Items</th><th class="r">USD</th><th class="r">LBP</th></tr></thead><tbody>';
 cats.forEach(function(c){var a=byCat[c]||{qty:0,amt:0,lbp:0};h+='<tr><td>'+esc(c)+'</td><td class="r">'+a.qty+'</td><td class="r">'+money(a.amt)+'</td><td class="r">'+Math.round(a.lbp).toLocaleString('en-US')+'</td></tr>'});
 h+='</tbody><tfoot><tr><td>Total</td><td class="r">'+units+'</td><td class="r">'+money(grand)+'</td><td class="r">'+Math.round(grandL).toLocaleString('en-US')+'</td></tr></tfoot></table></div></div>';

 $('report').innerHTML=h;

  ask('End Day '+dayNo+' now? Its totals are saved, and a new day starts from zero. You can open Day '+dayNo+' later from the list.','End day',function(){

  var rows=[['Invoice','Date','Time','Category','Item','Qty','Price USD','Cost USD','Line total USD','Rate LBP','Voided','Invoice discount USD (first line)']];
  S.sales.forEach(function(s){s.items.forEach(function(l,ix){rows.push([pad(s.no,4),dkey(s.ts),fmtTime(s.ts),l.cat,l.name,l.qty,l.price.toFixed(2),(l.cost||0).toFixed(2),(l.price*l.qty).toFixed(2),s.rate||S.rate,s.void?'yes':'no',(ix===0&&s.discount)?s.discount.amount.toFixed(2):''])})});
  showText('Sales as CSV',rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(',')}).join('\n'),'Tap Copy and paste into Notes, email or a spreadsheet app.','kiosk-sales-'+today()+'.csv');
 };
}
function restoreDialog(){
 openModal('<h3>Restore backup</h3><div class="f"><label for="rtx">Paste the backup text</label><textarea id="rtx" style="-webkit-user-select:text;user-select:text"></textarea></div><div class="f"><label for="rfile">Or choose a backup file</label><input type="file" id="rfile" accept=".json,.txt,application/json,text/plain"></div><div class="row"><button class="btn" id="rGo" style="flex:1">Restore</button><button class="btn sec" id="rNo" style="flex:1">Cancel</button></div>');
 $('rNo').onclick=closeModal;
 $('rfile').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){$('rtx').value=r.result};r.readAsText(f)};
 $('rGo').onclick=function(){
  var txt=$('rtx').value,d;
  try{d=JSON.parse(txt);if(!d.items||!d.sales||!d.cats)throw 0}catch(e){toast('That is not a valid backup');return}
  ask('Replace ALL current data with this backup?','Replace',function(){S=d;if(!S.rate)S.rate=89500;if(!S.store)S.store='Kiosk';migrate();cart={};cartOrder=[];save();closeModal();refresh();toast('Backup restored')},restoreDialog);
 };
}
var eDraft=null;
function recCost(d){var t=0;d.recipe.forEach(function(l){var g=findItem(l.itemId);if(g)t+=num(l.qty)*(g.cost||0)});return t}
function ingCands(){return S.items.filter(isBuyable).sort(function(a,b){return a.name.localeCompare(b.name)})}
function ingredientOptions(sel){
 return ingCands().map(function(i){return '<option value="'+i.id+'"'+(i.id===sel?' selected':'')+'>'+esc(i.name)+(i.supplier?' · '+esc(i.supplier):'')+' (recipe unit '+esc(i.unit)+(i.cost>0?', '+money(i.cost*fct(i))+'/'+esc(buyU(i)):'')+')</option>'}).join('');
}
function editItem(id){
 var it=id?findItem(id):null;
 eDraft=it?{id:it.id,name:it.name,price:String(it.price),cat:it.cat,recipe:(it.recipe||[]).map(function(r){return {itemId:r.itemId,qty:String(r.qty)}}),margin:''}
  :{id:null,name:'',price:'',cat:curCat||S.cats[0],recipe:[],margin:''};
 renderEdit();
}
function renderEdit(){
 var d=eDraft,hasRec=d.recipe.length>0,cands=ingCands();
 var h='<h3>'+(d.id?'Edit item':'New item')+'</h3>'+
 '<div class="f"><label for="iName">Name</label><input id="iName" value="'+esc(d.name)+'" placeholder="e.g. Espresso"></div>'+
 '<div class="f"><label for="iPrice">Selling price (USD)</label><input id="iPrice" type="number" inputmode="decimal" step="0.01" min="0" value="'+esc(d.price)+'" placeholder="0.00"></div>'+
 '<div class="f"><label for="iCat">Category</label><select id="iCat">'+S.cats.map(function(c){return '<option'+(d.cat===c?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'</select></div>';
 h+='<div class="rec"><div style="font-weight:700;margin-bottom:4px">Recipe</div><div class="note" style="margin:0 0 10px">Pick the stock items that go into one of these and how much of each. Each sale takes these amounts out of stock, and the recipe sets the cost.</div>';
 if(!cands.length&&!hasRec){
  h+='<div class="note" style="margin:0">You have no stock items yet. Add them in the Stock tab (for example coffee beans or a box of chips) and buy them there. They will then show up here.</div>';
 }else{
  d.recipe.forEach(function(l,i){
   var g=findItem(l.itemId);
   h+='<div class="rline"><select id="rI'+i+'" aria-label="Stock item">'+ingredientOptions(l.itemId)+'</select><input id="rQ'+i+'" aria-label="Quantity" type="number" inputmode="decimal" step="any" min="0" value="'+esc(l.qty)+'" placeholder="Qty"><span class="ru" id="rU'+i+'">'+(g?esc(g.unit):'')+'</span><button class="btn bad sm" data-rdel="'+i+'" aria-label="Remove">✕</button></div>';
  });
  h+='<button class="btn sec sm" id="rAdd">+ Add from stock</button>';
 }
 if(hasRec){
  h+='<div class="rtot"><span>Recipe cost per item</span><b id="rCost"></b></div><div id="rCostL" class="note" style="margin:2px 0 0;text-align:right"></div>'+
  '<div class="row" style="margin-top:10px"><input id="rM" aria-label="Target margin percent" type="number" inputmode="decimal" step="any" min="0" max="99" placeholder="Margin %" value="'+esc(d.margin)+'" style="width:120px"><button class="btn sec sm" id="rSug">Suggest price</button><span id="rNow" class="note" style="margin:0"></span></div>';
 }
 h+='</div><div class="row"><button class="btn" id="iSave" style="flex:1">Save</button>'+(d.id?'<button class="btn bad" id="iDel">Delete</button>':'')+'<button class="btn sec" id="iCancel">Cancel</button></div>';
 openModal(h,true);
 wireEdit();
}
function wireEdit(){
 var d=eDraft;
 function recInfo(){
  if(!$('rCost'))return;
  var c=recCost(d),missing=d.recipe.some(function(l){var g=findItem(l.itemId);return !g||!(g.cost>0)});
  $('rCost').textContent=money(c);
  $('rCostL').textContent=lbp(c)+(missing?' · some stock items have no cost yet':'');
  var p=num(d.price);
  $('rNow').textContent=(p>0&&c>0)?'Current margin '+Math.round((p-c)/p*100)+'%':'';
 }
 $('iName').oninput=function(){d.name=this.value};
 $('iPrice').oninput=function(){d.price=this.value;recInfo()};
 $('iCat').onchange=function(){d.cat=this.value};
 d.recipe.forEach(function(l,i){
  $('rI'+i).onchange=function(){l.itemId=this.value;var g=findItem(l.itemId);$('rU'+i).textContent=g?g.unit:'';recInfo()};
  $('rQ'+i).oninput=function(){l.qty=this.value;recInfo()};
 });
 $('modal').querySelectorAll('[data-rdel]').forEach(function(b){b.onclick=function(){d.recipe.splice(+b.dataset.rdel,1);renderEdit()}});
 if($('rAdd'))$('rAdd').onclick=function(){var c=ingCands()[0];d.recipe.push({itemId:c?c.id:'',qty:''});renderEdit()};
 if($('rM')){
  $('rM').oninput=function(){d.margin=this.value};
  $('rSug').onclick=function(){
   var c=recCost(d),m=num(d.margin);
   if(c<=0){toast('Add stock items that have a cost first');return}
   if(m<=0||m>=100){toast('Enter a margin between 1 and 99');return}
   d.price=r2(c/(1-m/100));$('iPrice').value=d.price;recInfo();
  };
 }
 recInfo();
 $('iCancel').onclick=closeModal;
 $('iSave').onclick=function(){
  var n=d.name.trim(),p=parseFloat(d.price);
  if(!n){toast('Enter a name');return}
  if(isNaN(p)||p<0){toast('Enter a valid price');return}
  var rec=d.recipe.filter(function(l){return num(l.qty)>0&&findItem(l.itemId)}).map(function(l){return {itemId:l.itemId,qty:num(l.qty)}});
  var f={name:n,price:Math.round(p*100)/100,cat:d.cat,kind:'sale',noSale:false,recipe:rec,track:false,unit:'pcs',stock:0,cost:0};
  if(d.id){var it=findItem(d.id);for(var k in f)it[k]=f[k]}else{f.id=uid();S.items.push(f)}
  save();closeModal();refresh();
 };
 if($('iDel'))$('iDel').onclick=function(){
  var it=findItem(d.id);if(!it)return;
  ask('Delete "'+it.name+'"? Past invoices are not affected.','Delete',function(){S.items=S.items.filter(function(x){return x.id!==it.id});delete cart[it.id];cartOrder=cartOrder.filter(function(x){return x!==it.id});save();closeModal();refresh()},function(){editItem(it.id)});
 };
}
load();
migrate();
if(!S.cats.length)S.cats=['Drinks','Cigarettes','Purchases'];
buildNumpad();
renderSale();
initDb();

/* Offline: keep the app files on the device */
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
